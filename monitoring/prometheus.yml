# Exemplo local. Altere o token junto com INTERNAL_TOKEN antes de usar outro ambiente.
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: porquinho-bank
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
    http_headers:
      INTERNAL-TOKEN:
        values: ['default_token']
