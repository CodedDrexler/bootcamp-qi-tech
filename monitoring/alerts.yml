groups:
  - name: porquinho-bank
    rules:
      - alert: BankHighErrorRate
        expr: sum(rate(bank_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(bank_http_requests_total[5m])), 0.001) > 0.01
        for: 5m
        labels:
          severity: critical
          owner: banking-team
        annotations:
          summary: Mais de 1% de respostas 5xx
          action: Correlacionar request-id; verificar banco e última mudança; interromper rollout.
      - alert: BankHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(bank_http_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
          owner: banking-team
        annotations:
          summary: Latência p95 acima de 500ms
          action: Verificar bloqueios e pool do PostgreSQL antes de aumentar réplicas.
      - alert: BankHighCPU
        expr: rate(process_cpu_seconds_total[2m]) > 0.8
        for: 2m
        labels:
          severity: critical
          owner: banking-team
        annotations:
          summary: Processo usando mais de 80% de um núcleo
          action: Verificar carga e perfil; dimensionar recursos ou réplicas.
      - alert: BankUnavailable
        expr: up{job="porquinho-bank"} == 0
        for: 1m
        labels:
          severity: critical
          owner: banking-team
        annotations:
          summary: API indisponível para coleta
          action: Conferir container, token de métricas e health check.
