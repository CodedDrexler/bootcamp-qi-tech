name: Banking acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INTERNAL_TOKEN: default_token
      SERVER_LOCALHOST: 127.0.0.1
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@127.0.0.1:5432/bootcamp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: docker compose up --build --wait --wait-timeout 180
      - run: pytest -v --junitxml=tmp/results.xml
      - run: docker compose --profile observability up -d --wait --wait-timeout 90
      - run: docker compose exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
      - run: python scripts/check_monitoring.py
      - name: Logs when failing
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tmp/results.xml
      - if: always()
        run: docker compose --profile observability down
